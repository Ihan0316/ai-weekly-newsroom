name = "ai-weekly-newsroom"
main = "worker.js"
compatibility_date = "2025-01-01"
# GEMINI_API_KEY 는 여기 적지 말 것(비밀). Cloudflare 변수/시크릿(암호화)으로 추가.

# IP별 일일 질문 한도용 KV(worker.js 의 env.RL). id 를 비워 두면 Workers Builds(GitHub 연동) 배포 때
# Cloudflare 가 KV 를 자동 생성하고, 이후 배포는 같은 KV 를 이어받는다(wrangler 자동 프로비저닝).
# 생성된 id 는 대시보드(Storage & Databases → KV)에서만 보이고 이 파일엔 기록되지 않음.
# 바인딩이 없으면 worker 는 rate-limit 없이 동작(graceful) — 2026-10 운영 배포가 이 상태였음.
[[kv_namespaces]]
binding = "RL"
