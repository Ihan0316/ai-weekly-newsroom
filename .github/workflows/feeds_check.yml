name: Feeds check

# 뉴스 소스 피드가 Actions 러너(데이터센터 IP)에서 실제 도달·파싱되는지 진단.
# 로컬은 되는데 Actions서 403 나는 소스(예: 요즘IT) 판별용. 수동 실행 전용, 읽기전용(커밋 없음).
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe feeds from runner
        env:
          TZ: Asia/Seoul
        run: |
          python - <<'PY'
          import datetime, pipeline_gemini as P
          today = datetime.date.today().isoformat()
          print("today:", today)
          total = 0
          for feed in P.FEEDS + P.DISABLED_FEEDS:   # 비활성 피드도 검사 → 복구되면 FEEDS 로 옮김
              cs = P.parse_feed(feed, today)
              off = feed in P.DISABLED_FEEDS
              total += 0 if off else len(cs)
              ex = cs[0]["title"][:50] if cs else "(0건 — 실패/차단?)"
              print(f"  {len(cs):3}  {feed['source']:14} {ex}" + ("  [비활성]" if off else ""))
          print("합계 후보(활성 피드):", total)
          PY
